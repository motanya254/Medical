{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Facility Finder helps users locate hospitals, clinics, maternal health services, and emergency facilities.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (Social icons, icons in navbar, footer etc.) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Manifest + Favicon -->
    <link rel="manifest" href="https://webnier.site/static/manifest.json">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

    <title>Dagoretti South Health Facility Finder</title>

    <style>
        /* Smooth fade-in animation */
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navbar styling */
        .navbar {
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Footer styling */
        footer {
            background: #0d1b2a;
        }
        footer a {
            color: #f8f9fa;
            text-decoration: none;
        }
        footer a:hover {
            color: #0dcaf0;
        }

        /* Social Icons */
        .social-icons i {
            font-size: 1.25rem;
            margin-right: 10px;
            transition: 0.3s;
        }
        .social-icons i:hover {
            color: #0dcaf0;
            transform: translateY(-3px);
        }
    </style>
</head>

<body class="fade-in">

<!-- NAVIGATION BAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            <i class="bi bi-hospital"></i> Facility Finder
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto fw-semibold">
                <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'facilityl' %}">Facility List</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'searchfacility' %}">Search</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>


<!-- PAGE CONTENT -->
<main>
    {% block content %}
    {% endblock %}
</main>


<!-- FOOTER -->
<footer class="text-light py-4 mt-5">
    <div class="container text-center">

        <!-- Social Media Icons -->
        <div class="social-icons mb-3">
    <a href="https://www.facebook.com/DagoCare" target="_blank" rel="noopener">
        <i class="bi bi-facebook"></i>
    </a>
    <a href="https://www.instagram.com/DagoCare" target="_blank" rel="noopener">
        <i class="bi bi-instagram"></i>
    </a>
    <a href="https://x.com/DagoCare" target="_blank" rel="noopener">
        <i class="bi bi-twitter-x"></i>
    </a>
    <a href="https://www.youtube.com" target="_blank" rel="noopener">
        <i class="bi bi-youtube"></i>
    </a>
    <!-- Email Icon -->
    <a href="mailto:sharon@contactdagocare.co.ke" target="_blank" rel="noopener">
        <i class="bi bi-envelope"></i>
    </a>
</div>

        <p class="mb-1">&copy; 2026 Dagoretti South Health Facility Finder</p>
        <p class="small mb-0">
            <i class="bi bi-heart-fill text-danger"></i>
            Empowering community health access.
        </p>
    </div>
</footer>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
