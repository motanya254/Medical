{% extends "base.html" %}

{% block content %}
<section class="py-5 text-center">
    <div class="container">
        <!-- Animated 404 number -->
        <h1 class="display-1 fw-bold text-danger fade-in-bounce">404</h1>

        <p class="lead mb-3 fade-in-up">Oops! Page not found.</p>
        <p class="text-muted mb-4 fade-in-up">The page you are looking for does not exist or has been moved.</p>

        <a href="{% url 'home' %}" class="btn btn-primary btn-lg fade-in-up">
            Go Back Home
        </a>
    </div>
</section>

<style>
/* Simple fade in */
.fade-in-up {
    animation: fadeInUp 0.9s ease-in-out;
}

.fade-in-bounce {
    animation: bounceIn 1s ease;
}

/* Keyframes for fadeInUp */
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Keyframes for bounceIn */
@keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); opacity: 1; }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); }
}
</style>
{% endblock %}
